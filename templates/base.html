<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="darkreader-lock">
    <title>{% block title %}James Evers{% endblock %}</title>
    <meta name="description" content="Personal site of James Evers — machine learning engineer, editor, and writer in Brooklyn, New York.">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "James Evers",
      "url": "https://jambon.net/",
      "jobTitle": "Machine Learning Engineer",
      "address": {"@type": "PostalAddress", "addressLocality": "Brooklyn", "addressRegion": "NY"},
      "sameAs": [
        "https://github.com/jevers9788",
        "https://www.linkedin.com/in/eversjames"
      ]
    }
    </script>
    <link rel="preload" href="/static/v1/eb-garamond-latin-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/v1/v2_blueprint.webp" as="image" type="image/webp">
    <link rel="stylesheet" href="/static/v1/style.css">
</head>
<body>
    <header>
        <nav></nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>&copy; 2025 James Evers</p>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
