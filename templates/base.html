<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="darkreader-lock">
    <title>{% block title %}James Evers{% endblock %}</title>
    <meta name="description" content="Personal site of James Evers — machine learning engineer, editor, and writer in Brooklyn, New York.">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "James Evers",
      "url": "https://jambon.net/",
      "jobTitle": "Machine Learning Engineer",
      "address": {"@type": "PostalAddress", "addressLocality": "Brooklyn", "addressRegion": "NY"},
      "sameAs": [
        "https://github.com/jevers9788",
        "https://www.linkedin.com/in/eversjames"
      ]
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <nav></nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>&copy; 2025 James Evers</p>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
